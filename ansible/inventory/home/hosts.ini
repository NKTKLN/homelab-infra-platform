# --- Infrastructure types ---

# Virtual machines
[vms]
vm-node-1        ansible_host=192.168.1.12
vm-ops-node      ansible_host=192.168.1.13
vm-gpu-worker-1  ansible_host=192.168.1.14
vm-amnezia-proxy ansible_host=192.168.1.20
vm-vpn           ansible_host=192.168.1.11

# LXC containers
[containers]
ct-caddy ansible_host=192.168.1.15

# Physical hosts (bare metal, not provisioned by Terraform)
[hypervisors]
pve-host ansible_host=192.168.1.169 ansible_user=root

# --- Functional groups ---

# VPN VM
[vpn]
vm-vpn

# Gateway CT
[gateway]
ct-caddy

# Regular VM
[nodes]
vm-node-1

# Operations VM
[operations]
vm-ops-node

# GPU VM
[gpu-workers]
vm-gpu-worker-1

# Amnezia SOCKS5 proxy VM
[proxy]
vm-amnezia-proxy

# Proxmox hypervisor (bare metal). Intentionally NOT in [vms]/baseline plays —
# gets node_exporter only, no common_baseline/base_server/ssh_trust, to avoid
# SSH root-login hardening or UFW default-deny clashing with Proxmox's own
# access (root@ SSH) and web UI/cluster ports.
[hypervisor]
pve-host

# --- Monitoring targets ---

# All hosts that run node_exporter and should be scraped by Prometheus
[node_exporter_targets:children]
vms
hypervisor
