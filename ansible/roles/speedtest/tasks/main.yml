- name: Ensure Debian family
  ansible.builtin.assert:
    that: ansible_facts.os_family == "Debian"
    fail_msg: "This role supports only Debian/Ubuntu."

- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - curl
      - jq
    state: present

- name: Ensure project directory
  ansible.builtin.file:
    path: "{{ speedtest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy speedtest script
  ansible.builtin.template:
    src: speedtest.sh.j2
    dest: "{{ speedtest_script_path }}"
    owner: root
    group: root
    mode: "0750"

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: speedtest.service.j2
    dest: /etc/systemd/system/speedtest.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Deploy systemd timer unit
  ansible.builtin.template:
    src: speedtest.timer.j2
    dest: /etc/systemd/system/speedtest.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart speedtest timer

- name: Ensure speedtest timer is enabled and running
  ansible.builtin.systemd:
    name: speedtest.timer
    daemon_reload: true
    enabled: true
    state: started
